services:
  lasertag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lasertag
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "5173"
      DATABASE_PATH: /app/data/bookings.sqlite
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
      LINK_SECRET: ${LINK_SECRET:?Set a separate random LINK_SECRET in .env}
      V79_PLATFORM_SHARED_SECRET: ${V79_PLATFORM_SHARED_SECRET:-}
      V79_PLATFORM_SHARED_SECRET_FILE: /run/secrets/v79-readonly-platform-token
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_BUSINESS_ADDRESS: ${MAIL_BUSINESS_ADDRESS:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v25.0}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_TOKEN: ${FACEBOOK_PAGE_TOKEN:-}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-}
      INSTAGRAM_TOKEN: ${INSTAGRAM_TOKEN:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
    expose:
      - "5173"
    volumes:
      - booking_data:/app/data
      - ${HOME}/.v79-secrets/owner-readonly-platform.token:/run/secrets/v79-readonly-platform-token:ro
    networks:
      - proxy_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid,nodev

volumes:
  booking_data:

networks:
  proxy_network:
    external: true
    name: proxy_network
